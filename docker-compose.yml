version: '3.8'

services:
  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      # Operating mode — open-source BYOK, no auth or billing
      SAAS_MODE: 'false'
      NEXT_PUBLIC_SAAS_MODE: 'false'
      NEXT_PUBLIC_APP_URL: 'http://localhost:3000'

      # Single-instance: use in-memory job store, no Redis needed
      REDIS_DISABLED: 'true'

      # Add your preset model API keys here (optional)
      # OPENROUTER_API_KEY: ''
      # DOUBAO_API_KEY: ''
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
